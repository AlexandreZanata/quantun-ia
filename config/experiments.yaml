# Configuração mínima após o reset científico de 2026-09-15.
# Somente estudos com dados públicos e avaliação multi-seed permanecem ativos.

defaults:
  profile: publication
  epochs: 50
  learning_rate: 0.01
  random_state: 42
  test_size: 0.3
  seeds: &publication_seeds [42, 123, 456, 789, 1024, 1337, 2048, 3001, 4096, 5000]

profiles:
  ci:
    seeds: [42, 123]
    epochs: 5
  publication:
    seeds: *publication_seeds
    epochs: 50

experiments:
  exp_011_uci_tabular_qml:
    description: "UCI breast cancer: perceptron, MLP pareada e QNN angle"
    exp_id: exp_011
    dataset: breast_cancer
    n_qubits: 4
    n_layers: 2
    models: [perceptron, classical_matched, quantum_angle]
    model_configs:
      perceptron: {learning_rate: 0.02}
      classical_matched: {learning_rate: 0.01}
      quantum_angle: {learning_rate: 0.02}

  exp_012_mnist_pca_qml:
    description: "MNIST 0 vs 1 com PCA: angle vs amplitude encoding"
    exp_id: exp_012
    dataset: mnist_binary
    n_samples: 500
    n_components: 8
    n_qubits: 4
    n_layers: 2
    model_configs:
      quantum_angle: {learning_rate: 0.02}
      quantum_amplitude: {learning_rate: 0.02}

  exp_024_quantum_nano_bc:
    description: "Híbrido nano vs baselines fortes no Wisconsin Breast Cancer"
    exp_id: exp_024
    dataset: breast_cancer
    n_qubits: 4
    n_layers: 2
    learning_rate: 0.02
    parity_threshold_pp: 2.0
    advantage_threshold_pp: 3.0
    save_checkpoints: true
    include_xgboost: true
    model_configs:
      logistic_regression: {}
      perceptron: {learning_rate: 0.02}
      classical_matched: {learning_rate: 0.01}
      hybrid_sandwich: {learning_rate: 0.02, reupload: true}
      xgboost_shallow: {}
    profile_overrides:
      ci:
        seeds: [42, 123]
        epochs: 15
        save_checkpoints: false
      publication:
        seeds: [42, 123, 456, 789, 1024, 1337, 2048, 3001, 4096, 5000,
                6001, 6002, 6003, 6004, 6005, 6006, 6007, 6008, 6009, 6010,
                6011, 6012, 6013, 6014, 6015, 6016, 6017, 6018, 6019, 6020]
        epochs: 50
        save_checkpoints: true

  exp_025_pima_generalization:
    description: "Generalização do híbrido nano no Pima Diabetes"
    exp_id: exp_025
    dataset: pima_diabetes
    n_qubits: 4
    n_layers: 2
    learning_rate: 0.02
    parity_threshold_pp: 2.0
    include_xgboost: true
    model_configs:
      logistic_regression: {}
      perceptron: {learning_rate: 0.02}
      classical_matched: {learning_rate: 0.01}
      hybrid_sandwich: {learning_rate: 0.02, reupload: true}
      xgboost_shallow: {}
    profile_overrides:
      ci:
        seeds: [42, 123]
        epochs: 15
      publication:
        seeds: [42, 123, 456, 789, 1024, 1337, 2048, 3001, 4096, 5000,
                6001, 6002, 6003, 6004, 6005, 6006, 6007, 6008, 6009, 6010,
                6011, 6012, 6013, 6014, 6015, 6016, 6017, 6018, 6019, 6020]
        epochs: 50
