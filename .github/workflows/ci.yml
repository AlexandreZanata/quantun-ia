name: Lean Research CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lean-research-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  formal-research-gate:
    name: Formal Research Gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONUNBUFFERED: "1"
      LEAN_NUM_THREADS: "1"

    steps:
      - name: Checkout frozen research state
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install lightweight test runner
        run: python -m pip install --disable-pip-version-check pytest==9.0.3

      - name: Validate hypotheses, acquisitions and verifier unit tests
        run: make PYTHON=python check

      - name: Set up pinned Lean and mathlib
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lean
          auto-config: "false"
          build: "true"
          test: "false"
          lint: "false"
          mk_all-check: "false"
          use-mathlib-cache: "true"

      - name: Run adversarial Lean kernel gate with clean replay
        run: make PYTHON=python lean-gate
